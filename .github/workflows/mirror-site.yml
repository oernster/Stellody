# Carry a change to the published site across to the repository that serves
# stellody.com, so the two hosts cannot drift apart.
#
# docs/ is served by GitHub Pages at stellody.co.uk, the canonical host. The
# same pages are served at stellody.com from oernster/stellody-website, which
# has no way of noticing when this repository changes. This workflow tells it,
# and the push it makes there starts Render's own deploy.
#
# Needs two secrets. MIRROR_TOKEN is a fine-grained personal access token
# scoped to oernster/stellody-website alone, with Contents set to read and
# write; without it nothing can be pushed at all. RENDER_DEPLOY_HOOK is the
# deploy hook from the Render service, which turns the deploy from something
# Render has to notice into something this workflow states; without it the
# mirror still updates while stellody.com waits for somebody to press deploy.
name: Mirror the site to stellody.com

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "sync_site.py"
      - ".github/workflows/mirror-site.yml"
  workflow_dispatch:

concurrency:
  group: mirror-site
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout answers a missing token with "Input required and not
      # supplied", which says nothing about which token or where it belongs.
      # A fine-grained token expires within the year, so this is a failure
      # worth teaching to explain itself.
      - name: Refuse early when the mirror token is missing
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_TOKEN is either unset or expired. Create a fine-grained personal access token scoped to oernster/stellody-website alone, with Contents set to read and write, then add it to this repository under Settings, Secrets and variables, Actions, named MIRROR_TOKEN."
            exit 1
          fi

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: Stellody

      - name: Check out the mirror
        uses: actions/checkout@v4
        with:
          repository: oernster/stellody-website
          token: ${{ secrets.MIRROR_TOKEN }}
          path: stellody-website

      - name: Carry the change across
        run: python Stellody/sync_site.py --target stellody-website/public

      - name: Push the mirror, only when something moved
        id: push
        working-directory: stellody-website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "Nothing moved; the mirror already matched."
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Mirror the site from Stellody@${GITHUB_SHA:0:7}"
          git push
          echo "moved=true" >> "$GITHUB_OUTPUT"

      # Render's own Auto-Deploy is set to On Commit and has been throughout,
      # yet three mirror pushes in a row went undeployed while a manual press
      # worked: it is not hearing the pushes. Every deploy since July was
      # triggered by hand or by a settings change, so the link has been deaf
      # for months without anything saying so. Asking outright removes the
      # dependency on Render noticing, which makes the deploy a step somebody
      # can read here rather than a hope about a service elsewhere.
      #
      # A dispatch run always asks, even when nothing moved. Re-running this
      # workflow is what somebody reaches for when the .com host looks stale,
      # so that gesture should be the one that fixes it.
      #
      # The secret is read through env rather than tested in an `if`: the
      # secrets context is not available to a step's `if`, so a condition
      # written there would silently never match.
      - name: Ask Render to deploy the mirror
        if: steps.push.outputs.moved == 'true' || github.event_name == 'workflow_dispatch'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is unset, so stellody.com keeps whatever it last deployed. Copy the deploy hook from the Render service, under Settings then Build and Deploy, then add it to this repository under Settings, Secrets and variables, Actions, named RENDER_DEPLOY_HOOK."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null
          echo "Render was asked to deploy the mirror."

      - name: Prove the two now agree
        run: python Stellody/sync_site.py --target stellody-website/public --check
