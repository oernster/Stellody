[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellody"
dynamic = ["version"]
description = "A calm, local-first FLAC music player."
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.7",
    "mutagen>=1.47",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.4",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["stellody*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=stellody.domain",
    "--cov=stellody.application",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]
